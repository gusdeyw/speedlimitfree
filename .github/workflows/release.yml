name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish publication in order; a newer build must not race an older one for Latest.
concurrency:
  group: windows-release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Stamp this build's version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/set-release-version.ps1 -BuildNumber ([int]$env:BUILD_NUMBER)
      - name: Build desktop, service, and installer; run Go and setup checks
        run: ./scripts/build.ps1
      - name: Install browser for UI checks
        working-directory: frontend
        run: npx playwright install chromium
      - name: Check application interface
        working-directory: frontend
        run: npm test
      - name: Check compiled installer lifecycle in isolated fixtures
        run: ./scripts/test-installer-native.ps1
      - name: Package downloads and release notes
        run: ./scripts/package-release.ps1 -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA
      - name: Save release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Save browser failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: build/release
      - name: Publish installer and ZIP as the latest release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1
